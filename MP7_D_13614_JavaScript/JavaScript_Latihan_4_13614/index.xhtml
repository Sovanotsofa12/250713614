<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org//TR//xhtml/DTD/xhtm1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <title> Form Pendaftaran Seminar(xhtml)</title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8"/>
    <script type="text/javascript" src="js/script.js"> 
        
    </script>
</head>

<body>
    <h1> Form Pendafataran Event Kampus </h1>
    <form action="#" method="post" onsubmit="return fn_valrom();">
        <p>Nama : <br /><input type="text" id="nama" name="nama" /> </p>
        <p>Email: <br /><input type="text" pattern="^[a-z0-9][a-z0-9_\.-]{0,}[a-z0-9]@[a-z0-9][a-z0-9_\.-]{0,}[a-z0-9][\.][a-z0-9]{2,4}$" id="email" name="email" /> </p>
        <p>Umur: <br /><input type="text" id="umur" name="umur" /> </p>
        <p>Jenis Acara: <br/>
            <select name="kategori" id="kategori">
                <option value="">-- Pilih --</option>
                <option value="W">Workshop</option>
                <option value="S">Seminar</option>
                <option value="L">Lomba Coding</option>
            </select></p>
        <p><input type="submit" value="Daftar"/></p>
    </form>
    
</body>

</html>
