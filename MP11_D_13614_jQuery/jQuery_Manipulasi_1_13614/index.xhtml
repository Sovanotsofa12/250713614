<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
        xml:lang="id" lang="id">
<head>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            type="text/javascript"></script>
    <style type="text/css">
        body {
            font-family: arial, sans-serif;
            margin: 30px;
        }

        .highlight{
            background-color: lightpink;
            padding: 10px
        }

        button{
            margin: 5px;
            padding: 8px 15px;
        }

    </style>
    <script type="text/javascript">
        $(document).ready(function(){
            $("#btnWarna").click(function(){
                $("#judul").css({
                    "color": "purple",
                    "font-size": "28px"
                });
            });
            $("#btnHighlight").click(function(){
                $("#deskripsi").addClass("highlight")
            });
        });
    </script>
</head>
<body>
    <h2 id="judul">informasi kegiatan kampus</h2>
    <p id="deskripsi">
        ikut berbagai kegiatan menraik dan kemabngkan kemampuan dirimu di kampus
    </p>
    <button id="btnWarna"> ubah warna judul</button>
    <button id="btnHighlight">tambhakan highlight</button>
</body>
</html>
